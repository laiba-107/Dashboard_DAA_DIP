<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Weighted Average Filter - DIP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --bg: #020617;
      --border: #1f2937;
      --accent: #38bdf8;
      --text: #e5e7eb;
      --muted: #9ca3af;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #0f172a 0, #020617 50%, #000 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 900px;
      background: rgba(15, 23, 42, 0.95);
      border-radius: 18px;
      border: 1px solid var(--border);
      padding: 18px 20px 22px;
    }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    .subtitle { font-size: 0.9rem; color: var(--muted); margin-bottom: 16px; }
    .top-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
      align-items: center;
    }
    .upload-label {
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-size: 0.9rem;
      cursor: pointer;
      background: rgba(15, 23, 42, 0.9);
    }
    .upload-label input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }
    .btn {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #0b1220;
      color: var(--text);
      font-size: 0.9rem;
      cursor: pointer;
    }
    .btn.primary {
      border-color: var(--accent);
      background: linear-gradient(135deg, #0369a1, #38bdf8);
      color: #0b1120;
      font-weight: 600;
    }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .hint { color: var(--muted); font-size: 0.8rem; }
    .kernel-box {
      margin-bottom: 10px;
      font-size: 0.85rem;
    }
    .kernel-grid {
      display: inline-grid;
      grid-template-columns: repeat(3, 32px);
      gap: 4px;
      margin-top: 4px;
    }
    .kernel-cell {
      width: 32px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      background: #020617;
    }
    .canvas-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-top: 10px;
    }
    .canvas-panel {
      background: #020617;
      border-radius: 14px;
      border: 1px solid var(--border);
      padding: 10px;
    }
    .canvas-panel h2 {
      font-size: 0.95rem;
      margin: 0 0 6px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    canvas {
      width: 100%;
      max-height: 450px;
      display: block;
      border-radius: 10px;
      background: #020617;
    }
    .status { margin-top: 8px; font-size: 0.8rem; color: var(--muted); }
    @media (max-width: 900px) { .canvas-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="card">
    <h1>Weighted Average Filter</h1>
    <div class="subtitle">
      Apply a 3×3 Gaussian-like weighted averaging filter (smooths more in the centre).
    </div>

    <div class="top-row">
      <label class="upload-label">
        <input type="file" id="fileInput" accept="image/*" />
        <span>📂 Choose Image</span>
      </label>
      <button class="btn primary" id="applyBtn" disabled>Apply Weighted Average</button>
    </div>

    <div class="kernel-box">
      Kernel used (1/16 ×):
      <div class="kernel-grid">
        <div class="kernel-cell">1</div>
        <div class="kernel-cell">2</div>
        <div class="kernel-cell">1</div>
        <div class="kernel-cell">2</div>
        <div class="kernel-cell">4</div>
        <div class="kernel-cell">2</div>
        <div class="kernel-cell">1</div>
        <div class="kernel-cell">2</div>
        <div class="kernel-cell">1</div>
      </div>
    </div>

    <div class="canvas-row">
      <div class="canvas-panel">
        <h2>Original <span id="origSize" class="hint"></span></h2>
        <canvas id="origCanvas"></canvas>
      </div>
      <div class="canvas-panel">
        <h2>Filtered <span id="info" class="hint"></span></h2>
        <canvas id="procCanvas"></canvas>
      </div>
    </div>

    <div class="status" id="status">Load an image to begin.</div>
  </div>

  <script>
    const fileInput = document.getElementById("fileInput");
    const applyBtn = document.getElementById("applyBtn");
    const origCanvas = document.getElementById("origCanvas");
    const procCanvas = document.getElementById("procCanvas");
    const origCtx = origCanvas.getContext("2d");
    const procCtx = procCanvas.getContext("2d");
    const statusEl = document.getElementById("status");
    const origSizeEl = document.getElementById("origSize");
    const infoEl = document.getElementById("info");
    let imgLoaded = false;

    const kernel = [
      [1, 2, 1],
      [2, 4, 2],
      [1, 2, 1]
    ];
    const kSum = 16;

    fileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const maxWidth = 600;
          const scale = img.width > maxWidth ? maxWidth / img.width : 1;
          const w = Math.round(img.width * scale);
          const h = Math.round(img.height * scale);
          origCanvas.width = w;
          origCanvas.height = h;
          procCanvas.width = w;
          procCanvas.height = h;
          origCtx.drawImage(img, 0, 0, w, h);
          procCtx.drawImage(img, 0, 0, w, h);
          imgLoaded = true;
          applyBtn.disabled = false;
          origSizeEl.textContent = `${w}×${h}px`;
          infoEl.textContent = "";
          statusEl.textContent = "Image loaded. Click “Apply Weighted Average”.";
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    function applyWeightedAverage() {
      if (!imgLoaded) return;
      const src = origCtx.getImageData(0, 0, origCanvas.width, origCanvas.height);
      const dst = procCtx.createImageData(src.width, src.height);
      const { width: w, height: h, data: s } = src;
      const d = dst.data;
      const r = 1; // 3x3 kernel radius

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const idx = (y * w + x) * 4;

          if (x < r || x >= w - r || y < r || y >= h - r) {
            d[idx] = s[idx];
            d[idx + 1] = s[idx + 1];
            d[idx + 2] = s[idx + 2];
            d[idx + 3] = s[idx + 3];
            continue;
          }

          let sumR = 0, sumG = 0, sumB = 0;
          for (let j = -r; j <= r; j++) {
            for (let i = -r; i <= r; i++) {
              const xx = x + i;
              const yy = y + j;
              const sIdx = (yy * w + xx) * 4;
              const wgt = kernel[j + r][i + r];
              sumR += s[sIdx] * wgt;
              sumG += s[sIdx + 1] * wgt;
              sumB += s[sIdx + 2] * wgt;
            }
          }

          d[idx] = Math.round(sumR / kSum);
          d[idx + 1] = Math.round(sumG / kSum);
          d[idx + 2] = Math.round(sumB / kSum);
          d[idx + 3] = 255;
        }
      }

      procCtx.putImageData(dst, 0, 0);
    }

    applyBtn.addEventListener("click", () => {
      try {
        applyWeightedAverage();
        infoEl.textContent = "3×3 weighted (Gaussian-like) filter";
        statusEl.textContent = "Weighted average filter applied.";
      } catch (err) {
        statusEl.textContent = "Error: " + err.message;
      }
    });
  </script>
</body>
</html>
