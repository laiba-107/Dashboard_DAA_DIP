<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Laplacian Image Enhancement - DIP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --bg: #020617;
      --border: #1f2937;
      --accent: #f97316;
      --text: #e5e7eb;
      --muted: #9ca3af;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #0f172a 0, #020617 50%, #000 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 1000px;
      background: rgba(15, 23, 42, 0.95);
      border-radius: 18px;
      border: 1px solid var(--border);
      padding: 18px 20px 22px;
    }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    .subtitle { font-size: 0.9rem; color: var(--muted); margin-bottom: 16px; }
    .top-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
      align-items: center;
    }
    .upload-label {
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-size: 0.9rem;
      cursor: pointer;
      background: rgba(15, 23, 42, 0.9);
    }
    .upload-label input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }
    .btn {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #0b1220;
      color: var(--text);
      font-size: 0.9rem;
      cursor: pointer;
    }
    .btn.primary {
      border-color: var(--accent);
      background: linear-gradient(135deg, #ea580c, #f97316);
      color: #0b1120;
      font-weight: 600;
    }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.85rem;
    }
    input[type="number"] {
      width: 80px;
      background: #020617;
      border-radius: 999px;
      border: 1px solid var(--border);
      padding: 6px 10px;
      color: var(--text);
      font-size: 0.85rem;
    }
    .hint { color: var(--muted); font-size: 0.8rem; }
    .kernel-box {
      margin-bottom: 8px;
      font-size: 0.85rem;
    }
    .kernel-grid {
      display: inline-grid;
      grid-template-columns: repeat(3, 32px);
      gap: 4px;
      margin-top: 4px;
    }
    .kernel-cell {
      width: 32px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      background: #020617;
    }
    .canvas-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-top: 10px;
    }
    .canvas-panel {
      background: #020617;
      border-radius: 14px;
      border: 1px solid var(--border);
      padding: 10px;
    }
    .canvas-panel h2 {
      font-size: 0.95rem;
      margin: 0 0 6px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    canvas {
      width: 100%;
      max-height: 350px;
      display: block;
      border-radius: 10px;
      background: #020617;
    }
    .status { margin-top: 8px; font-size: 0.8rem; color: var(--muted); }
    @media (max-width: 1050px) { .canvas-row { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 800px) { .canvas-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="card">
    <h1>Laplacian for Image Enhancement</h1>
    <div class="subtitle">
      Sharpen the image using Laplacian and then adding it back to the original.
    </div>

    <div class="top-row">
      <label class="upload-label">
        <input type="file" id="fileInput" accept="image/*" />
        <span>📂 Choose Image</span>
      </label>
      <div class="field">
        <label for="lambda">λ (scaling factor)</label>
        <div style="display:flex;align-items:center;gap:6px;">
          <input type="number" id="lambda" step="0.1" value="1.0" />
          <span class="hint">Typical: 0.5 – 1.5</span>
        </div>
      </div>
      <button class="btn primary" id="applyBtn" disabled>Apply Laplacian Enhancement</button>
    </div>

    <div class="kernel-box">
      Laplacian kernel used:
      <div class="kernel-grid">
        <div class="kernel-cell">0</div>
        <div class="kernel-cell">-1</div>
        <div class="kernel-cell">0</div>
        <div class="kernel-cell">-1</div>
        <div class="kernel-cell">4</div>
        <div class="kernel-cell">-1</div>
        <div class="kernel-cell">0</div>
        <div class="kernel-cell">-1</div>
        <div class="kernel-cell">0</div>
      </div>
    </div>

    <div class="canvas-row">
      <div class="canvas-panel">
        <h2>Original <span id="origSize" class="hint"></span></h2>
        <canvas id="origCanvas"></canvas>
      </div>
      <div class="canvas-panel">
        <h2>Laplacian Response <span class="hint">(edges)</span></h2>
        <canvas id="lapCanvas"></canvas>
      </div>
      <div class="canvas-panel">
        <h2>Enhanced <span id="info" class="hint"></span></h2>
        <canvas id="enhCanvas"></canvas>
      </div>
    </div>

    <div class="status" id="status">Load an image to begin.</div>
  </div>

  <script>
    const fileInput = document.getElementById("fileInput");
    const applyBtn = document.getElementById("applyBtn");
    const lambdaInput = document.getElementById("lambda");

    const origCanvas = document.getElementById("origCanvas");
    const lapCanvas = document.getElementById("lapCanvas");
    const enhCanvas = document.getElementById("enhCanvas");

    const origCtx = origCanvas.getContext("2d");
    const lapCtx = lapCanvas.getContext("2d");
    const enhCtx = enhCanvas.getContext("2d");

    const statusEl = document.getElementById("status");
    const origSizeEl = document.getElementById("origSize");
    const infoEl = document.getElementById("info");
    let imgLoaded = false;

    const kernel = [
      [0, -1, 0],
      [-1, 4, -1],
      [0, -1, 0]
    ];
    const r = 1;

    fileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const maxWidth = 600;
          const scale = img.width > maxWidth ? maxWidth / img.width : 1;
          const w = Math.round(img.width * scale);
          const h = Math.round(img.height * scale);

          origCanvas.width = w; origCanvas.height = h;
          lapCanvas.width = w; lapCanvas.height = h;
          enhCanvas.width = w; enhCanvas.height = h;

          origCtx.drawImage(img, 0, 0, w, h);
          lapCtx.clearRect(0, 0, w, h);
          enhCtx.drawImage(img, 0, 0, w, h);

          imgLoaded = true;
          applyBtn.disabled = false;
          origSizeEl.textContent = `${w}×${h}px`;
          infoEl.textContent = "";
          statusEl.textContent = "Image loaded. Set λ and apply Laplacian enhancement.";
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    function computeLaplacian() {
      const src = origCtx.getImageData(0, 0, origCanvas.width, origCanvas.height);
      const lap = lapCtx.createImageData(src.width, src.height);
      const { width: w, height: h, data: s } = src;
      const d = lap.data;

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const idx = (y * w + x) * 4;

          if (x < r || x >= w - r || y < r || y >= h - r) {
            d[idx] = d[idx + 1] = d[idx + 2] = 128; // neutral grey
            d[idx + 3] = 255;
            continue;
          }

          let lr = 0, lg = 0, lb = 0;
          for (let j = -r; j <= r; j++) {
            for (let i = -r; i <= r; i++) {
              const xx = x + i;
              const yy = y + j;
              const sIdx = (yy * w + xx) * 4;
              const wgt = kernel[j + r][i + r];
              lr += s[sIdx] * wgt;
              lg += s[sIdx + 1] * wgt;
              lb += s[sIdx + 2] * wgt;
            }
          }
          // Shift to visible range (just for visualization)
          d[idx] = Math.min(255, Math.max(0, 128 + lr));
          d[idx + 1] = Math.min(255, Math.max(0, 128 + lg));
          d[idx + 2] = Math.min(255, Math.max(0, 128 + lb));
          d[idx + 3] = 255;
        }
      }
      lapCtx.putImageData(lap, 0, 0);
      return { src, lap };
    }

    function enhanceImage(lambda, src, lap) {
      const enh = enhCtx.createImageData(src.width, src.height);
      const { width: w, height: h, data: s } = src;
      const ld = lap.data;
      const ed = enh.data;

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const idx = (y * w + x) * 4;
          // Recover Laplacian (undo 128-shift for edges)
          const lr = ld[idx] - 128;
          const lg = ld[idx + 1] - 128;
          const lb = ld[idx + 2] - 128;

          let r = s[idx] + lambda * lr;
          let g = s[idx + 1] + lambda * lg;
          let b = s[idx + 2] + lambda * lb;

          ed[idx] = Math.min(255, Math.max(0, r));
          ed[idx + 1] = Math.min(255, Math.max(0, g));
          ed[idx + 2] = Math.min(255, Math.max(0, b));
          ed[idx + 3] = 255;
        }
      }
      enhCtx.putImageData(enh, 0, 0);
    }

    applyBtn.addEventListener("click", () => {
      if (!imgLoaded) return;
      try {
        const lambda = parseFloat(lambdaInput.value);
        if (Number.isNaN(lambda)) throw new Error("Invalid λ value.");
        const { src, lap } = computeLaplacian();
        enhanceImage(lambda, src, lap);
        infoEl.textContent = `λ = ${lambda.toFixed(2)}`;
        statusEl.textContent = "Laplacian enhancement applied.";
      } catch (err) {
        statusEl.textContent = "Error: " + err.message;
      }
    });
  </script>
</body>
</html>
