<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Huffman Encoding & Decoding — Greedy Tree</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  :root{
    --bg:#0b1220;
    --panel:#0f172a;
    --panel2:#0c1526;
    --border:#1f2a44;
    --text:#e5e7eb;
    --muted:#9ca3b2;
    --accent:#38bdf8;
    --accent2:#60a5fa;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,Arial;
    background:var(--bg);
    color:var(--text);
    padding:16px;
  }
  h1{font-size:1.6rem;margin-bottom:6px}
  .sub{color:var(--muted);font-size:.9rem;margin-bottom:16px}
  .layout{
    display:grid;
    grid-template-columns:minmax(260px,320px) minmax(0,1fr);
    gap:16px;
  }
  .panel{
    background:var(--panel);
    border-radius:12px;
    border:1px solid var(--border);
    padding:12px 14px;
  }
  .panel h2{font-size:1rem;margin-bottom:6px}
  textarea{
    width:100%;
    min-height:100px;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:8px;
    color:var(--text);
    padding:8px;
    font-family:monospace;
    font-size:.9rem;
  }
  .btn-row{display:flex;gap:8px;margin-top:8px;}
  button{
    border:none;
    border-radius:999px;
    padding:6px 14px;
    font-size:.85rem;
    cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#0b1120;
    font-weight:500;
  }
  .section{
    margin-bottom:16px;
    padding:10px 12px;
    background:var(--panel);
    border-radius:10px;
    border:1px solid var(--border);
  }
  .section-title{
    font-size:.95rem;
    font-weight:600;
    margin-bottom:6px;
  }
  .help{font-size:.85rem;color:var(--muted);}
  table{
    width:100%;
    border-collapse:collapse;
    font-size:.8rem;
    margin-top:6px;
  }
  th,td{
    border:1px solid var(--border);
    padding:3px 6px;
    text-align:center;
  }
  th{background:#0b1526;font-weight:600;}
  .stack-steps{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-top:4px;
    font-size:.8rem;
  }
  .stack-row{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .stack-label{
    min-width:60px;
    color:var(--muted);
  }
  .node-box{
    min-width:44px;
    padding:4px 6px;
    text-align:center;
    border-radius:6px;
    border:1px solid var(--border);
    background:var(--panel2);
  }
  .node-leaf{background:rgba(56,189,248,0.15);}
  .node-internal{background:rgba(250,204,21,0.12);}
  .node-symbol{font-weight:600;font-size:.8rem;}
  .node-freq{font-size:.7rem;color:var(--muted);}
  .bitstream{
    font-family:monospace;
    font-size:.85rem;
    word-wrap:break-word;
  }
  .bit0{color:#38bdf8;}
  .bit1{color:#f97373;}
  svg{
    background:#0c1526;
    border-radius:10px;
    border:1px solid var(--border);
  }
  @media (max-width:768px){
    .layout{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<h1>Huffman Encoding &amp; Decoding (Greedy Spanning Tree)</h1>
<p class="sub">Enter a message (e.g. <code>ACCBAAA</code>). The algorithm will build the Huffman tree greedily, show the priority queue horizontally, and draw a tree like your reference.</p>

<div class="layout">
  <!-- INPUT PANEL -->
  <div class="panel">
    <h2>Input</h2>
    <p class="help">Message:</p>
    <textarea id="msgInput" placeholder="ACCBAAA"></textarea>
    <div class="btn-row">
      <button onclick="runHuffmanGreedy()">Build Huffman Tree</button>
    </div>
  </div>

  <!-- OUTPUT PANEL -->
  <div id="output" class="panel">
    <p class="help">Run the algorithm to see the visualization here.</p>
  </div>
</div>

<script>
/* ---------- Helpers ---------- */
function escapeHTML(str){
  return String(str).replace(/[&<>"']/g, m =>
    ({"&":"&amp;","<":"&lt;","&gt;":"&gt;","\"":"&quot;","'":"&#039;"}[m] || m)
  );
}
function buildFreqMap(msg){
  const map={};
  for(const ch of msg){map[ch]=(map[ch]||0)+1;}
  return map;
}

/* ---------- Huffman (Greedy) ---------- */
// Node: {id, symbol, freq, left, right}
function buildHuffmanTreeGreedy(freqMap){
  const symbols = Object.keys(freqMap);
  if(symbols.length < 2){
    throw new Error("Need at least two distinct symbols for Huffman coding.");
  }

  const nodes = [];
  let nextId = 0;
  for(const s of symbols){
    nodes.push({id:nextId++, symbol:s, freq:freqMap[s], left:null, right:null});
  }

  const historyStates = [];
  let active = nodes.slice();
  historyStates.push(cloneState(active));

  while(active.length > 1){
    active.sort((a,b)=> a.freq-b.freq || (a.symbol||"").localeCompare(b.symbol||""));
    const n1 = active.shift();
    const n2 = active.shift();
    const merged = {
      id: nextId++,
      symbol: null,
      freq: n1.freq + n2.freq,
      left: n1,
      right: n2
    };
    active.push(merged);
    historyStates.push(cloneState(active));
  }

  return { root: active[0], historyStates, symbols };
}
function cloneState(active){
  return active.map(n => ({
    id:n.id, symbol:n.symbol, freq:n.freq, isLeaf:n.symbol!=null
  }));
}

function buildCodes(root){
  const codes={};
  (function dfs(node,path){
    if(!node)return;
    if(node.symbol!=null){
      codes[node.symbol]=path || "0";
      return;
    }
    dfs(node.left,  path+"0");
    dfs(node.right, path+"1");
  })(root,"");
  return codes;
}

function decodeBits(root, bits){
  let node=root, res="";
  for(const b of bits){
    if(b!=="0"&&b!=="1") continue;
    node = (b==="0") ? node.left : node.right;
    if(!node) throw new Error("Bitstring does not match this tree.");
    if(node.symbol!=null){
      res += node.symbol;
      node = root;
    }
  }
  return res;
}

/* ---------- Render Priority Queue ---------- */
function renderStackHistory(historyStates){
  let html = `<div class="section">
    <div class="section-title">Priority Queue (Greedy Steps)</div>
    <p class="help">Each row shows the queue after a step, from smallest frequency to largest.</p>
    <div class="stack-steps">`;

  historyStates.forEach((state, idx) => {
    html += `<div class="stack-row">
      <div class="stack-label">Step ${idx}</div>`;
    const sorted = state.slice().sort((a,b)=>a.freq-b.freq||(a.symbol||"").localeCompare(b.symbol||""));
    sorted.forEach(node=>{
      const cls = node.isLeaf ? "node-leaf" : "node-internal";
      const label = node.isLeaf ? node.symbol : "--";
      html += `<div class="node-box ${cls}">
        <div class="node-symbol">${escapeHTML(label)}</div>
        <div class="node-freq">${node.freq}</div>
      </div>`;
    });
    html += `</div>`;
  });

  html += `</div></div>`;
  return html;
}

/* ---------- D3 Tree Visualization ---------- */
function drawTree(root){
  const width  = 700;
  const height = 420;

  const svg = d3.select("#treeSvg")
    .attr("width", width)
    .attr("height", height)
    .attr("viewBox", [0, 0, width, height]);

  svg.selectAll("*").remove();

  const g = svg.append("g")
    .attr("transform", "translate(20,40)");

  // IMPORTANT: tell d3.hierarchy how to get children (left/right)
  const rootHierarchy = d3.hierarchy(
    root,
    d => {
      const children = [];
      if (d.left)  children.push(d.left);
      if (d.right) children.push(d.right);
      return children.length ? children : null;
    }
  );

  const treeLayout = d3.tree().size([width - 80, height - 100]);
  treeLayout(rootHierarchy);

  // draw links
  g.selectAll(".link")
    .data(rootHierarchy.links())
    .join("path")
    .attr("class", "link")
    .attr("fill", "none")
    .attr("stroke", "#000000")
    .attr("stroke-width", 2)
    .attr("d", d3.linkVertical()
      .x(d => d.x)
      .y(d => d.y)
    );

  // edge labels 0 / 1
  g.selectAll(".edge-label")
    .data(rootHierarchy.links())
    .join("text")
    .attr("class", "edge-label")
    .attr("x", d => (d.source.x + d.target.x) / 2)
    .attr("y", d => (d.source.y + d.target.y) / 2 - 4)
    .attr("text-anchor", "middle")
    .attr("font-size", "11px")
    .attr("fill", "#ef4444")
    .text(d => {
      const parent = d.source.data;
      const child  = d.target.data;
      return parent.left === child ? "0" : "1";
    });

  // nodes
  const node = g.selectAll(".node")
    .data(rootHierarchy.descendants())
    .join("g")
    .attr("class", "node")
    .attr("transform", d => `translate(${d.x},${d.y})`);

  node.append("circle")
    .attr("r", 18)
    .attr("fill", "#e9d5ff")   // light purple
    .attr("stroke", "#000000")
    .attr("stroke-width", 1.5);

  // frequency inside circle
  node.append("text")
    .attr("text-anchor", "middle")
    .attr("dy", "4")
    .attr("font-size", "12px")
    .attr("fill", "#000000")
    .text(d => d.data.freq);

  // symbol under leaf nodes
  node.filter(d => d.data.symbol != null)
    .append("text")
    .attr("text-anchor", "middle")
    .attr("dy", "32")
    .attr("font-size", "12px")
    .attr("fill", "#000000")
    .text(d => d.data.symbol);
}

/* ---------- MAIN ENTRY ---------- */
function runHuffmanGreedy(){
  const outDiv = document.getElementById("output");
  const msg = document.getElementById("msgInput").value.trim();

  if(!msg){
    outDiv.innerHTML = `<p class="help">Please enter a message first (e.g. ACCBAAA).</p>`;
    return;
  }

  try{
    const freqMap = buildFreqMap(msg);
    const { root, historyStates, symbols } = buildHuffmanTreeGreedy(freqMap);
    const codes = buildCodes(root);

    // encode & decode
    let bitstream = "";
    for(const ch of msg) bitstream += codes[ch];
    const decoded = decodeBits(root, bitstream);

    let html = "";

    // Frequencies & codes
    html += `<div class="section">
      <div class="section-title">Character Frequencies &amp; Huffman Codes</div>
      <table>
        <thead><tr><th>Character</th><th>Frequency</th><th>Code</th></tr></thead>
        <tbody>`;
    symbols.sort().forEach(s=>{
      html += `<tr>
        <td>${escapeHTML(s)}</td>
        <td>${freqMap[s]}</td>
        <td>${escapeHTML(codes[s])}</td>
      </tr>`;
    });
    html += `</tbody></table></div>`;

    // Stack evolution
    html += renderStackHistory(historyStates);

    // Tree SVG container
    html += `<div class="section">
      <div class="section-title">Huffman Tree (like your example)</div>
      <svg id="treeSvg"></svg>
    </div>`;

    // Encoding / decoding summary
    const colouredBits = bitstream.split("").map(b =>
      b === "0" ? `<span class="bit0">0</span>` : `<span class="bit1">1</span>`
    ).join("");
    html += `<div class="section">
      <div class="section-title">Encoding &amp; Decoding</div>
      <p class="help"><strong>Message:</strong> ${escapeHTML(msg)}</p>
      <p class="help"><strong>Encoded bitstream:</strong></p>
      <p class="bitstream">${colouredBits}</p>
      <p class="help"><strong>Decoded message:</strong> ${escapeHTML(decoded)}</p>
    </div>`;

    outDiv.innerHTML = html;

    // Draw the tree to match the screenshot style
    drawTree(root);

  }catch(err){
    outDiv.innerHTML = `<p class="help">Error: ${escapeHTML(err.message)}</p>`;
  }
}
</script>
</body>
</html>
