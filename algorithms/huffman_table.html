<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Huffman Encoding & Decoding — Triangular Table</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  :root{
    --bg:#0b1220;
    --panel:#0f172a;
    --panel2:#0c1526;
    --border:#1f2a44;
    --text:#e5e7eb;
    --muted:#9ca3b2;
    --accent:#38bdf8;
    --accent2:#60a5fa;
    --good:#22c55e;
    --warn:#facc15;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,Arial;
    background:var(--bg);
    color:var(--text);
    padding:16px;
  }
  h1{font-size:1.6rem;margin-bottom:8px}
  .hi-sub{color:var(--muted);margin-bottom:16px;font-size:.9rem}
  .hi-layout{display:grid;grid-template-columns:minmax(260px,320px) minmax(0,1fr);gap:16px;}
  .hi-panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px;}
  .hi-panel h2{font-size:1rem;margin-bottom:6px;}
  textarea{
    width:100%;min-height:140px;background:var(--panel2);
    border:1px solid var(--border);border-radius:8px;color:var(--text);
    padding:8px;font-family:monospace;font-size:.85rem;
  }
  .hi-btn-row{display:flex;gap:8px;margin-top:8px;}
  button{
    border:none;border-radius:999px;padding:6px 14px;font-size:.85rem;cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0b1120;font-weight:500;
  }
  button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--border);}
  .hi-out-section{margin-bottom:16px;padding:10px 12px;background:var(--panel);
    border-radius:10px;border:1px solid var(--border);}
  .algo-table{width:100%;border-collapse:collapse;font-size:.8rem;margin-top:6px;}
  .algo-table th,.algo-table td{
    border:1px solid var(--border);padding:3px 6px;text-align:center;min-width:32px;
  }
  .algo-table th{background:#0b1526;font-weight:600;}
  .hf-merge{background:rgba(250,204,21,0.25);}
  .hf-carry{background:rgba(34,197,94,0.25);}
  .hi-bit0{color:#38bdf8;}
  .hi-bit1{color:#f97373;}
  .hi-decode-out{font-family:monospace;font-size:.85rem;margin-top:4px;white-space:pre-wrap;}
  @media(max-width:768px){.hi-layout{grid-template-columns:1fr;}}
</style>
</head>
<body>
<h1>Huffman Encoding &amp; Decoding</h1>
<p class="hi-sub">Enter a grid of symbols (letters, digits, etc.). Frequencies will be computed automatically, and the algorithm will encode, decode, and visualize the Huffman triangular table.</p>

<div class="hi-layout">
  <div class="hi-panel">
    <h2>Input Grid</h2>
    <textarea id="hiGridInput" placeholder="A B A
C D A
E F A"></textarea>
    <div class="hi-btn-row">
      <button onclick="runHuffman()">Run Huffman</button>
    </div>
  </div>

  <div id="hiOutput" class="hi-panel">
    <p class="hi-sub">Run Huffman to see the results here.</p>
  </div>
</div>

<script>
/* ---------- UTILITIES ---------- */
function escapeHTML(str){return String(str).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function parseGrid(text){
  const grid=[],freqMap={};
  const lines=text.split(/\n/).map(l=>l.trim()).filter(Boolean);
  for(const line of lines){
    const cells=line.split(/[\s,]+/).filter(Boolean);
    grid.push(cells);
    for(const c of cells)freqMap[c]=(freqMap[c]||0)+1;
  }
  return {grid,freqMap};
}

/* ---------- HUFFMAN CORE ---------- */
function buildHuffmanFromFrequencies(symbols,freqs){
  const totalFreq=freqs.reduce((a,b)=>a+b,0);
  const nodesById={},groups=[];let nextId=0;
  for(let i=0;i<symbols.length;i++){
    const id=nextId++;nodesById[id]={id,symbol:symbols[i],freq:freqs[i],left:null,right:null};
    groups.push({id,symbols:[symbols[i]],freq:freqs[i]});
  }
  const merges=[],stepGroups=[null];let step=0;
  let active=groups.slice();
  while(active.length>1){
    step++;
    active.sort((a,b)=>a.freq-b.freq);
    const g1=active[0],g2=active[1];
    const newId=nextId++,newFreq=g1.freq+g2.freq,newSymbols=g1.symbols.concat(g2.symbols);
    nodesById[newId]={id:newId,symbol:null,freq:newFreq,left:nodesById[g1.id],right:nodesById[g2.id]};
    merges.push({step,leftId:g1.id,rightId:g2.id,newId});
    active=active.slice(2);active.push({id:newId,symbols:newSymbols,freq:newFreq});
    stepGroups[step]=active.map(g=>({id:g.id,symbols:g.symbols.slice(),prob:g.freq/totalFreq}));
  }
  const root=nodesById[active[0].id];
  const codes={};
  (function build(node,prefix){if(!node)return;if(node.symbol!=null){codes[node.symbol]=prefix||"0";return;}build(node.left,prefix+"0");build(node.right,prefix+"1");})(root,"");
  const codesSnapshots=[null];for(let i=1;i<=merges.length;i++)codesSnapshots[i]=codes;
  return {history:{merges,stepGroups,codesSnapshots,codes,root},totalFreq};
}
function decodeBitstream(bitstream,root){
  const res=[];let node=root;
  for(const ch of bitstream){
    if(ch!=="0"&&ch!=="1")continue;
    node=ch==="0"?node.left:node.right;
    if(node.symbol!=null){res.push(node.symbol);node=root;}
  }
  return res;
}

/* ---------- BUILD TRIANGULAR TABLE ---------- */
function buildFinalHuffmanTableData(symbols,freqMap,totalFreq,history){
  const steps=history.merges.length,rows=[];
  const sortedSyms=[...symbols].sort((a,b)=>freqMap[b]-freqMap[a]||String(a).localeCompare(String(b)));
  for(const s of sortedSyms)rows.push({symbol:s,freq:freqMap[s],prob:freqMap[s]/totalFreq,cells:[]});
  for(let j=1;j<=steps;j++){
    const groupsJ=history.stepGroups[j],codesJ=history.codesSnapshots[j],mergedId=history.merges[j-1].newId;
    for(const row of rows){
      const s=row.symbol;let cell=null;
      for(const g of groupsJ){
        if(g.symbols.includes(s)){
          cell={prob:g.prob,code:codesJ[s],highlight:g.id===mergedId?"merged":"carry"};break;
        }
      }
      row.cells.push(cell);
    }
  }
  return {rows,steps};
}

/* ---------- RENDER TRIANGULAR TABLE ---------- */
function renderFinalHuffmanTable(data){
  const {rows,steps}=data;
  let html=`<div class="hi-out-section"><div class="hi-out-title">Final Huffman Triangular Table</div>
  <table class="algo-table"><thead><tr><th>S</th><th>F</th><th>Prob.[final code]</th>`;
  for(let j=1;j<=steps;j++)html+=`<th>${j}</th>`;
  html+=`</tr></thead><tbody>`;
  rows.forEach((row,rowIndex)=>{
    const finalCode=row.cells[row.cells.length-1]?.code||"";
    html+=`<tr><td>${escapeHTML(row.symbol)}</td><td>${row.freq}</td>
    <td>${row.prob.toFixed(3)} [${escapeHTML(finalCode)}]</td>`;
    for(let j=0;j<steps;j++){
      if(j>steps-rowIndex-1){html+=`<td></td>`;continue;}
      const c=row.cells[j];
      if(!c){html+=`<td></td>`;}
      else{
        const cls=c.highlight==="merged"?"hf-merge":"hf-carry";
        html+=`<td class="${cls}">${c.prob.toFixed(3)} [${escapeHTML(c.code)}]</td>`;
      }
    }
    html+=`</tr>`;
  });
  html+=`</tbody></table></div>`;
  return html;
}

/* ---------- MAIN ---------- */
function runHuffman(){
  const out=document.getElementById("hiOutput");
  const gridText=document.getElementById("hiGridInput").value.trim();
  if(!gridText){out.innerHTML=`<p class="hi-sub">Please enter a grid of symbols first.</p>`;return;}
  const {grid,freqMap}=parseGrid(gridText);
  const symbols=Object.keys(freqMap);
  if(symbols.length<2){out.innerHTML=`<p class="hi-sub">At least two distinct symbols are required.</p>`;return;}
  const freqs=symbols.map(s=>freqMap[s]);
  const {history,totalFreq}=buildHuffmanFromFrequencies(symbols,freqs);
  const codes=history.codes;
  const tableData=buildFinalHuffmanTableData(symbols,freqMap,totalFreq,history);

  let bitstream="";
  grid.flat().forEach(sym=>{if(codes[sym])bitstream+=codes[sym];});
  const decoded=decodeBitstream(bitstream,history.root);

  let html=`<div class="hi-out-section"><div class="hi-out-title">Symbol Frequencies &amp; Codes</div>
  <table class="algo-table"><thead><tr><th>Symbol</th><th>Freq</th><th>Prob</th><th>Code</th></tr></thead><tbody>`;
  symbols.sort().forEach(s=>{
    html+=`<tr><td>${escapeHTML(s)}</td><td>${freqMap[s]}</td>
    <td>${(freqMap[s]/totalFreq).toFixed(3)}</td><td>${escapeHTML(codes[s])}</td></tr>`;
  });
  html+=`</tbody></table></div>`;
  html+=renderFinalHuffmanTable(tableData);
  html+=`<div class="hi-out-section"><div class="hi-out-title">Encoded Bitstream</div>
  <p class="hi-bit0">${bitstream.split("").map(b=>b==="0"?"<span class='hi-bit0'>0</span>":"<span class='hi-bit1'>1</span>").join("")}</p></div>`;
  html+=`<div class="hi-out-section"><div class="hi-out-title">Decoded Sequence</div>
  <div class="hi-decode-out">${decoded.join(" ")}</div></div>`;
  out.innerHTML=html;
}
</script>
</body>
</html>
