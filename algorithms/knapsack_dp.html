<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>0/1 Knapsack — Dynamic Programming</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --bg:#0b1220;
    --panel:#0f172a;
    --border:#1f2a44;
    --text:#e5e7eb;
    --muted:#9aa3b2;
    --accent:#38bdf8;
    --good:#22c55e;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",Arial;
  }
  header{
    padding:14px 22px;
    border-bottom:1px solid var(--border);
    background:#09101d;
  }
  header h1{margin:0;font-size:1.3rem;}
  header p{margin:4px 0 0;font-size:.9rem;color:var(--muted);}
  main{max-width:960px;margin:20px auto;padding:0 16px;}
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:16px;
  }
  .card h2{margin:0 0 10px;font-size:1.1rem;}
  .row{display:grid;grid-template-columns:repeat(12,1fr);gap:10px;margin-bottom:10px;}
  .col-4{grid-column:span 4}
  .col-12{grid-column:span 12}
  label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:4px;}
  input[type="number"],input[type="text"]{
    width:100%;
    padding:8px 10px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#0a1426;
    color:var(--text);
    font-size:.95rem;
  }
  input:focus{outline:none;border-color:var(--accent);}
  .btn{
    appearance:none;
    border:none;
    border-radius:10px;
    padding:9px 14px;
    cursor:pointer;
    color:#fff;
    background:linear-gradient(90deg,#22c55e,#16a34a);
    font-size:.95rem;
  }
  .muted{color:var(--muted);font-size:.88rem;}
  .algo-table{
    width:100%;
    border-collapse:collapse;
    margin:8px 0 6px;
    background:#0a1325;
    font-size:.9rem;
  }
  .algo-table thead th{background:#11203a}
  .algo-table th,.algo-table td{
    border:1px solid var(--border);
    padding:6px 8px;
    text-align:center;
  }
  .algo-table tbody tr:nth-child(odd){background:#0b162a}
  .algo-table tbody tr:nth-child(even){background:#0c182f}
</style>
</head>
<body>
<header>
  <h1>0/1 Knapsack — Dynamic Programming</h1>
  <p>Enter capacity, item weights and values. The algorithm will build the DP table V[i][W] and show selected items.</p>
</header>

<main>
  <section class="card">
    <h2>Input</h2>
    <div class="row">
      <div class="col-4">
        <label>Knapsack Capacity (W)</label>
        <input id="kdpW" type="number" value="25" min="0">
      </div>
      <div class="col-4">
        <label>Item Weights (comma-separated)</label>
        <input id="kdpWeights" type="text" value="5,10,25">
      </div>
      <div class="col-4">
        <label>Item Values / Benefits (comma-separated)</label>
        <input id="kdpValues" type="text" value="70,90,140">
      </div>
      <div class="col-12">
        <button class="btn" onclick="runKnapsackDP()">Run 0/1 Knapsack (DP)</button>
        <p class="muted">The table V[i][k] shows the maximum value using first i items and capacity k.</p>
      </div>
    </div>
  </section>

  <section class="card" id="kdpOut">
    <!-- Output will be injected here -->
  </section>
</main>

<script>
/* ===== Helpers ===== */
const numList = s => s.split(/[, ]+/).map(t=>t.trim()).filter(Boolean).map(Number);

/* ===== 0/1 Knapsack DP logic ===== */
function knapsackDPTable(weights, values, W){
  const n = weights.length;
  const V = Array.from({length:n+1},()=>Array(W+1).fill(0));
  for(let i=1;i<=n;i++){
    const wi=weights[i-1], vi=values[i-1];
    for(let k=0;k<=W;k++){
      if(wi<=k){
        V[i][k] = Math.max(vi + V[i-1][k-wi], V[i-1][k]);
      }else{
        V[i][k] = V[i-1][k];
      }
    }
  }
  return V;
}

function backtrack(V, weights, W){
  const sel=[]; 
  let i=weights.length, k=W;
  while(i>0 && k>=0){
    if(V[i][k] !== V[i-1][k]){ 
      sel.push(i); 
      k -= weights[i-1]; 
      i--; 
    }else{
      i--;
    }
  }
  sel.reverse();      // 1-based indices
  return sel;
}

function runKnapsackDP(){
  const W = +document.getElementById('kdpW').value;
  const weights = numList(document.getElementById('kdpWeights').value);
  const values  = numList(document.getElementById('kdpValues').value);
  const out = document.getElementById('kdpOut');
  out.innerHTML='';

  if(!Number.isFinite(W) || W<0){
    out.innerHTML='<p class="muted">Capacity W must be ≥ 0.</p>';
    return;
  }
  if(weights.length===0 || weights.length!==values.length){
    out.innerHTML='<p class="muted">Provide matching lists of weights and values.</p>';
    return;
  }

  const V = knapsackDPTable(weights, values, W);
  const chosen = backtrack(V, weights, W);
  const maxVal = V[weights.length][W];

  let summary = `<p><strong>Number of items:</strong> ${weights.length}
    &nbsp; | &nbsp; <strong>Capacity:</strong> ${W}
    &nbsp; | &nbsp; <strong>Max value:</strong> ${maxVal}</p>`;

  // DP table
  let table = `<table class="algo-table"><thead><tr><th>i \\ W</th>`;
  for(let k=0;k<=W;k++) table += `<th>${k}</th>`;
  table += `</tr></thead><tbody>`;

  for(let i=0;i<=weights.length;i++){
    table += `<tr><th>${i}</th>`;
    for(let k=0;k<=W;k++){
      table += `<td>${V[i][k]}</td>`;
    }
    table += `</tr>`;
  }
  table += `</tbody></table>`;

  // Selected items
  let itemsHTML = `<p><strong>Items included:</strong> ${
    chosen.length
      ? chosen.map(i=>`#${i} (w=${weights[i-1]}, v=${values[i-1]})`).join(', ')
      : '— (no item selected)'
  }</p>`;
  const totalW = chosen.reduce((a,i)=>a+weights[i-1],0);
  const totalV = chosen.reduce((a,i)=>a+values[i-1],0);
  itemsHTML += `<p><strong>Total weight used:</strong> ${totalW}
    &nbsp; | &nbsp; <strong>Total value:</strong> ${totalV}</p>`;

  out.innerHTML = summary + table + itemsHTML;
}
</script>
</body>
</html>
